name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r requirements-dev.txt
      - name: Check diagnostic Python scripts
        run: pnpm lint:python
      - name: Verify committed model assets
        run: pnpm verify:model
      - run: pnpm exec playwright install --with-deps chromium
      - name: Format, lint, test and build the app
        run: pnpm check
      - name: Verify model assets in the built app
        run: pnpm verify:model --dir react-web-app/dist
      - name: Preserve browser failures
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-results
          path: |
            test-results
            playwright-report
          retention-days: 7

  deploy:
    name: Deploy production
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Validate deployment secrets
        shell: bash
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
      - run: pnpm install --frozen-lockfile
      - name: Verify Vercel team and project access
        run: pnpm exec tsx scripts/check-vercel-access.ts
      - name: Pull production project settings
        run: pnpm exec vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build Vercel output
        run: pnpm exec vercel build --prod --token="$VERCEL_TOKEN"
      - name: Verify model in the deployment payload
        run: pnpm verify:model --dir .vercel/output/static
      - name: Deploy verified output
        id: production
        shell: bash
        run: |
          url=$(pnpm exec vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $url" >> "$GITHUB_STEP_SUMMARY"
